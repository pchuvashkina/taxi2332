name: UI Kit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Проверки дизайн-системы, не требующие установки пакетов.
  # Идут первыми: падают за секунды и дают понятную причину.
  fast:
    name: Проверки без зависимостей
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taxi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lockfile синхронизирован с package.json
        run: node scripts/check-lockfile.mjs

      - name: Сгенерированные токены не разошлись с tokens.json
        run: node scripts/build-tokens.mjs --check

      - name: Статическая верификация ссылок и путей
        run: node scripts/verify-static.mjs

      - name: Guard дизайн-системы (SCSS и TS/TSX)
        run: node scripts/check-tokens.mjs

  build:
    name: Линт, тесты, сборка
    runs-on: ubuntu-latest
    needs: fast
    defaults:
      run:
        working-directory: taxi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taxi/package-lock.json

      - run: npm ci
      - run: npm run lint:styles
      - run: npm test -- --watchAll=false
      - run: npm run build
